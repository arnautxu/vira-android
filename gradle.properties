# `updateDebugScreenshotTest` fa les captures dins del procés de Gradle (no és una `Test`): amb
# 3 GB es quedava sense memòria passades unes 340 i es penjava.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Proves de captura de Compose (`com.android.compose.screenshot`).
android.experimental.enableScreenshotTest=true
