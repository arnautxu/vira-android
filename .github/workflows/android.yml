name: Android

# El disparador és el push. Abans `pull_request` també corria a cada commit, i cada commit d'una
# branca amb PR es compilava dues vegades; ara només corre en obrir la PR. El push ja deixa el resultat a la PR (és el mateix commit),
# prova la branca juntada amb main (pas «Junta el main d'ara») i és qui fa les captures de
# captures/<branca>, que els fils necessiten abans d'obrir cap PR.
on:
  push:
    # Les branques de captures només guarden imatges.
    branches-ignore: ['captures/**']
    # Un canvi que només toca textos de documentació no canvia l'APK ni les captures.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Un sol build més per PR, quan s'obre: main pot haver canviat des de l'últim push de la
  # branca. Els commits següents ja els cobreix el push.
  pull_request:
    types: [opened, reopened]

# Un push nou a la mateixa branca atura el que encara corria per a l'anterior: només compta
# l'últim. A main cada build té grup propi (el número del build), perquè cap no se'n salti:
# cada build de main és una release.
concurrency:
  group: android-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Compila, prova i deixa l'APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Abans ho feia el build de la PR: provar la branca tal com quedarà en fusionar-la, amb el
      # main d'ara a sobre. Si no es pot juntar sense conflicte, es prova la branca sola.
      - name: Junta el main d'ara a la branca
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898613+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main || { git merge --abort; echo "::warning::La branca té conflictes amb main; es prova sola."; }

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compila i passa les proves
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      # El nom de l'artefacte no pot portar «/», i les branques dels fils sí (claude/…).
      - name: Nom de l'artefacte
        id: artefacte
        run: echo "nom=vira-debug-${GITHUB_REF_NAME}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - name: Desa l'APK de la branca
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artefacte.outputs.nom }}
          path: app/build/outputs/apk/debug/app-debug.apk

      # Captures (clar, fosc i lletra gran) de les proves de `src/screenshotTest`. Primer es
      # comparen amb les aprovades que hi ha al repositori: si una pantalla canvia sense voler,
      # aquest pas falla. Després es tornen a fer i es publiquen a la branca
      # `captures/<branca>`, d'on el fil les agafa per posar-les al costat de les de l'iPhone.
      - name: Compara les captures amb les aprovades
        id: compara
        continue-on-error: true
        run: |
          if find app/src -type d -name reference -path '*creenshot*' | grep -q .; then
            ./gradlew validateDebugScreenshotTest --no-daemon --no-configuration-cache
          fi

      - name: Fa les captures de la branca
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: ./gradlew updateDebugScreenshotTest --no-daemon --no-configuration-cache

      - name: Publica les captures a captures/<branca>
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          set -e
          src=$(find app/src -type d -name reference -path '*creenshot*' | head -1)
          [ -n "$src" ] || exit 0
          echo "Captures a $src"
          dest=$(mktemp -d)
          cp -R "$src"/. "$dest"/
          cd "$dest"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898613+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Captures de ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/captures/${GITHUB_REF_NAME}"

      - name: Atura si alguna captura ha canviat sense voler
        if: steps.compara.outcome == 'failure'
        run: |
          echo "Alguna captura no coincideix amb l'aprovada (app/src/…/reference)."
          exit 1

      - name: Publica l'APK de main com a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
