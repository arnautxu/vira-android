name: Android

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Compila, prova i deixa l'APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compila i passa les proves
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Desa l'APK de la branca
        uses: actions/upload-artifact@v4
        with:
          name: vira-debug-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publica l'APK de main com a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
